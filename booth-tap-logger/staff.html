<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fdf5f6">
  <meta name="robots" content="noindex">
  <title>スタッフ用 読み取り | EmpoweringWOMEN</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/staff.js" defer></script>
</head>
<body class="staff">
  <header class="app-header">
    <div class="app-header-inner">
      <span class="brand">
        <span class="brand-en">EmpoweringWOMEN</span><small>みんまちSHOP ブース記録</small>
      </span>
      <span class="staff-badge">STAFF</span>
    </div>
  </header>

  <main class="app" id="main">
    <!-- ===== 設定 ===== -->
    <section class="view" id="view-setup" aria-labelledby="setup-title">
      <div class="page-head">
        <p class="kicker">STAFF SETUP</p>
        <h1 class="page-title" id="setup-title">スタッフ設定</h1>
        <p class="page-lead">読み取りを始める前に、担当するブースを設定してください。</p>
      </div>

      <div class="pad">
        <form class="card setup-step" id="key-form" novalidate>
          <p class="step-label" id="step1-label"><span>1</span>合言葉を入力</p>
          <label class="sr-only" for="staff-key">スタッフ用の合言葉</label>
          <input class="text-input" id="staff-key" type="password" inputmode="numeric" autocomplete="off" placeholder="運営から共有された合言葉" required>
          <button class="button button-dark button-center" type="submit" id="load-booths">ブース一覧を読み込む</button>
          <p class="form-error" id="setup-error" role="alert"></p>
        </form>

        <div class="card setup-step" id="booth-step" hidden>
          <p class="step-label"><span>2</span>担当ブースを選択</p>
          <ul class="booth-list" id="booth-list" role="radiogroup" aria-label="ブース一覧"></ul>
        </div>
      </div>

    </section>

    <!-- ===== 読み取り ===== -->
    <section class="view" id="view-scan" aria-labelledby="scan-booth" hidden>
      <div class="pad">
        <div class="card booth-bar" style="margin-top:14px">
          <div>
            <p class="kicker">BOOTH</p>
            <p class="scan-booth" id="scan-booth">-</p>
          </div>
          <button class="chip-button" type="button" id="change-setup">設定を変更</button>
        </div>

        <div class="chips">
          <span class="chip">この端末の記録 <strong id="stat-count">0</strong>件</span>
          <span class="chip is-warn" id="stat-pending" hidden>未送信 <strong id="stat-pending-n">0</strong>件</span>
        </div>

        <div class="scanner-view">
          <video id="scanner-video" playsinline muted autoplay></video>
          <div class="scanner-frame" aria-hidden="true"><span></span><i></i></div>
          <button class="button button-primary camera-start" type="button" id="camera-start" hidden>カメラを起動</button>
        </div>
        <p class="staff-msg" id="scanner-msg" role="status">来場者の「マイQR」を枠の中に写してください</p>

        <div class="section">
          <div class="section-head"><h2>最近の記録</h2><span class="meta">未送信は自動で再送します</span></div>
          <div class="card" style="padding:4px 0">
            <ol class="recent-list" id="recent-list"></ol>
          </div>
        </div>
      </div>
      <div style="height:32px"></div>
    </section>
  </main>

  <!-- 設定画面の下部固定ボタン（片手で押せる位置） -->
  <div class="bottom-bar" id="setup-bar">
    <button class="button button-primary" type="button" id="start-scan" disabled>このブースで読み取りを開始<span aria-hidden="true">→</span></button>
  </div>

  <!-- 読み取り後のアクション選択（ボトムシート） -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="action-sheet" id="action-panel" role="dialog" aria-modal="true" aria-labelledby="action-who" hidden>
    <p class="action-who" id="action-who">読み取りました。記録する内容を選んでください</p>
    <p class="action-id">No.<span id="action-id">------</span></p>
    <div class="action-buttons" id="action-buttons"></div>
    <button class="text-button" type="button" id="action-cancel">記録せずに戻る</button>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
