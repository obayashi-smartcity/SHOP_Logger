<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>案内ポスター印刷 | マイQR</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #fff; }
    .toolbar { padding: 24px 0; }
    .toolbar .button { max-width: 260px; margin-top: 12px; }
    .poster { width: min(100%, 180mm); margin: 0 auto 40px; padding: 16mm 12mm; border-radius: 18px; background: var(--color-base); text-align: center; border: 1px solid var(--color-line); }
    .poster .brand-en { font-size: 1.8rem; }
    .poster h1 { margin: 10px 0 6px; font-family: var(--font-serif); font-weight: 500; font-size: 2.2rem; }
    .poster .lead { margin: 0 0 18px; font-weight: 700; }
    .poster .qr { width: 90mm; height: 90mm; margin: 0 auto; padding: 5mm; background: #fff; border-radius: 12px; }
    .poster .qr svg { width: 100%; height: 100%; display: block; }
    .poster ol { display: inline-block; margin: 18px auto 0; text-align: left; font-weight: 700; }
    .poster .url { margin-top: 10px; font-size: .7rem; color: var(--color-muted); word-break: break-all; }
    @media print { .toolbar { display: none; } @page { size: A4; margin: 10mm; } .poster { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style>
  <script src="js/vendor/qrcode.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const url = new URL('./', location.href).href; // 来場者画面（index.html）
      const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
      document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      document.getElementById('url').textContent = url;
    });
  </script>
</head>
<body>
  <div class="container toolbar">
    <p class="small">受付などに掲示する「マイQR」案内ポスターです。読み取ると来場者画面（マイQR）が開きます。</p>
    <button class="button button-primary" type="button" onclick="window.print()">印刷する<span aria-hidden="true">→</span></button>
  </div>
  <article class="poster">
    <p class="brand-en">EmpoweringWOMEN</p>
    <p class="kicker">MY QR CODE</p>
    <h1>マイQRを表示しよう</h1>
    <p class="lead">スマホのカメラで読み取ってください</p>
    <div class="qr" id="qr"></div>
    <ol>
      <li>表示された「マイQR」を各ブースでスタッフに見せる</li>
      <li>景品受付で「景品と引き換える」を押す</li>
    </ol>
    <p class="url" id="url"></p>
  </article>
</body>
</html>
